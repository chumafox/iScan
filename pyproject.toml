[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iscan"
version = "0.2.0"
description = "iOS device diagnostics CLI — generates beautiful HTML reports (3uTools alternative)"
requires-python = ">=3.11"
dependencies = [
    "pymobiledevice3>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov"]

[project.scripts]
iscan = "iscan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iscan"]
